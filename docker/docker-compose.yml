version: "3.9"

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fastapi-proxy
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    depends_on:
      - redis
    volumes:
      - ..:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  redis:
    image: redis:7
    container_name: redis-cache
    ports:
      - "6390:6379"